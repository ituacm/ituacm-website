services:
  app:
    # YALNIZCA BİRİNİ kullan:
    image: ituacm-website:latest
    # build:
    #   context: .
    #   platform: linux/amd64  # M1/ARM için gerekiyorsa

    expose:
      - "80" # container içi port (Nginx ise 80)

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public

      traefik.http.services.website-app.loadbalancer.server.port: "80"

      traefik.http.routers.website-app-http.entrypoints: http
      traefik.http.routers.website-app-http.middlewares: https-redirect
      traefik.http.routers.website-app-http.rule: "Host(`ituacm.com`) || Host(`www.ituacm.com`)"

      traefik.http.routers.website-app-https.entrypoints: https
      traefik.http.routers.website-app-https.rule: "Host(`ituacm.com`) || Host(`www.ituacm.com`)"
      traefik.http.routers.website-app-https.tls: "true"
      traefik.http.routers.website-app-https.tls.certresolver: le

    networks:
      - traefik-public
      - default
    restart: always

networks:
  traefik-public:
    external: true
